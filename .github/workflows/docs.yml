name: Documentation site

# Builds the help site in website/ (English and Dutch) and publishes it on GitHub Pages:
# https://rhisijmuiden.github.io/stackpilot/
# Pull requests only build it (with --strict) so broken links show up before a merge.

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install MkDocs
        run: pip install -r website/requirements.txt
      - name: Build
        run: website/build.sh
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
