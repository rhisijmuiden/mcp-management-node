name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      MMN_TEST_PG_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      MMN_TEST_DATABASE_URL: postgresql+asyncpg://mmn:mmn@127.0.0.1:5432/mmn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: PostgreSQL 17 client and nginx
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 nginx-light
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Test database
        run: |
          psql "$MMN_TEST_PG_ADMIN" -v ON_ERROR_STOP=1 -c "CREATE ROLE mmn LOGIN PASSWORD 'mmn'" -c "CREATE DATABASE mmn_test OWNER mmn"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check mmn tests
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          node scripts/check-i18n.mjs
          npm run build

  agent:
    name: Agent (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - working-directory: agent
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - run: bash agent/build.sh --out /tmp/agent-dist && ls -l /tmp/agent-dist

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n deploy/install.sh deploy/build-release.sh agent/build.sh
          shellcheck -S error deploy/*.sh agent/build.sh agent/packaging/debian/*
