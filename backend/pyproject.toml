[project]
name = "mcp-management-node"
version = "0.13.0"  # informational; the app reads mmn/VERSION or ../VERSION at runtime
description = "Stackpilot: one modern interface for Proxmox VE environments and managed servers, with an MCP endpoint for Claude"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "aiosmtplib>=3.0",
  "dkimpy>=1.1",
  "asyncssh>=2.18",
  "apscheduler>=3.11,<4",
  "httpx>=0.28",
  "jinja2>=3.1",
  "packaging>=24",
  "mcp>=2.3,<3",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyftpdlib>=2.0", "pyopenssl>=24", "aiosmtpd>=1.4", "ruff>=0.8"]

[project.scripts]
mmn = "mmn.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mmn*"]

[tool.setuptools.package-data]
mmn = ["VERSION", "BUILD.json", "mail_templates/*", "report_templates/*", "migrations/*", "migrations/versions/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "UP042"]
