site_name: Stackpilot
site_description: The AI gateway and IT management server for MSPs and IT administrators.
site_url: https://rhisijmuiden.github.io/stackpilot/
repo_url: https://github.com/rhisijmuiden/stackpilot
repo_name: rhisijmuiden/stackpilot
edit_uri: edit/main/website/docs/
copyright: Stackpilot · RHIS

docs_dir: docs
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Archivo
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/stackpilot.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhisijmuiden/stackpilot

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: nl
          name: Nederlands
          build: true
          site_description: De AI-gateway en IT-beheerserver voor MSP's en IT-beheerders.
          nav_translations:
            Home: Home
            Getting started: Aan de slag
            Installation: Installatie
            First steps: Eerste stappen
            Finding your way: Je weg vinden
            Customers: Klanten
            Customers and their settings: Klanten en hun instellingen
            Customer portal and tickets: Klantportaal en tickets
            Documentation and password vault: Documentatie en wachtwoordkluis
            Costs and licences: Kosten en licenties
            Machines: Machines
            Agents and pairing: Agents en koppelen
            Proxmox VE: Proxmox VE
            Servers: Servers
            Workstations: Werkplekken
            AI and MCP: AI en MCP
            Connect your AI: Je AI koppelen
            Policies and approvals: Beleid en goedkeuringen
            MCP hub and tool catalog: MCP-hub en toolcatalogus
            Automation: Automatisering
            Nightly checks and morning summary: Nachtelijke checks en ochtendsamenvatting
            Runbooks: Runbooks
            Automatic recovery: Automatisch herstel
            Scheduled tasks and Proxmox maintenance: Geplande taken en Proxmox-onderhoud
            Change calendar: Wijzigingskalender
            Monthly reports: Maandrapporten
            Care: Zorg
            Customer backups: Klantbackups
            Monitoring, uptime and SLA: Monitoring, uptime en SLA
            Certificates, firewall and VPN: Certificaten, firewall en VPN
            Updates and software: Updates en software
            Integrations: Integraties
            Integrations overview: Overzicht integraties
            Microsoft 365 and Entra ID: Microsoft 365 en Entra ID
            UniFi: UniFi
            GitHub, software library and deployments: GitHub, softwarebibliotheek en deployments
            Administration: Beheer
            Mail server: Mailserver
            App backups and restore: App-backups en herstel
            Info, updates and channels: Info, updates en kanalen
            Users, security and web server: Gebruikers, beveiliging en webserver
            Reference: Naslag
            How it works: Hoe het werkt
            MCP tool reference: MCP-toolnaslag
            Questions and glossary: Vragen en begrippen

nav:
  - Home: index.md
  - Getting started:
      - Installation: start/install.md
      - First steps: start/first-steps.md
      - Finding your way: start/finding-your-way.md
  - Customers:
      - Customers and their settings: customers/customers.md
      - Customer portal and tickets: customers/portal-tickets.md
      - Documentation and password vault: customers/docs-vault.md
      - Costs and licences: customers/costs.md
  - Machines:
      - Agents and pairing: machines/agents.md
      - Proxmox VE: machines/proxmox.md
      - Servers: machines/servers.md
      - Workstations: machines/workstations.md
  - AI and MCP:
      - Connect your AI: ai/connect.md
      - Policies and approvals: ai/policies-approvals.md
      - MCP hub and tool catalog: ai/mcp-hub.md
  - Automation:
      - Nightly checks and morning summary: automation/morning-summary.md
      - Runbooks: automation/runbooks.md
      - Automatic recovery: automation/recovery.md
      - Scheduled tasks and Proxmox maintenance: automation/maintenance.md
      - Change calendar: automation/change-calendar.md
      - Monthly reports: automation/reports.md
  - Care:
      - Customer backups: care/backups.md
      - Monitoring, uptime and SLA: care/monitoring.md
      - Certificates, firewall and VPN: care/netsec.md
      - Updates and software: care/updates-software.md
  - Integrations:
      - Integrations overview: integrations/index.md
      - Microsoft 365 and Entra ID: integrations/m365.md
      - UniFi: integrations/unifi.md
      - GitHub, software library and deployments: integrations/github.md
  - Administration:
      - Mail server: admin/mail.md
      - App backups and restore: admin/backups.md
      - Info, updates and channels: admin/updates.md
      - Users, security and web server: admin/security.md
  - Reference:
      - How it works: reference/architecture.md
      - MCP tool reference: reference/mcp-tools.md
      - Questions and glossary: reference/faq.md

validation:
  links:
    anchors: warn
